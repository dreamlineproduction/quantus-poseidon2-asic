# Tiny Tapeout project information
project:
  title:        "Quantus Poseidon2 Crypto ASIC Miner"
  author:       "Ayan Mukhopadhyay"
  discord:      ""
  description:  "64-bit Goldilocks Poseidon2 QPoW hardware miner core"
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x2"          # Maximum valid size on SkyWater 130nm!

  # Your top module name must start with "tt_um_".
  top_module:  "tt_um_example"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "target_diff_0"
  ui[1]: "target_diff_1"
  ui[2]: "target_diff_2"
  ui[3]: "target_diff_3"
  ui[4]: "target_diff_4"
  ui[5]: "target_diff_5"
  ui[6]: "target_diff_6"
  ui[7]: "target_diff_7"

  # Outputs
  uo[0]: "nonce_0"
  uo[1]: "nonce_1"
  uo[2]: "nonce_2"
  uo[3]: "nonce_3"
  uo[4]: "nonce_4"
  uo[5]: "nonce_5"
  uo[6]: "nonce_6"
  uo[7]: "golden_nonce_found"

  # Bidirectional pins
  uio[0]: "nonce_7"
  uio[1]: "nonce_8"
  uio[2]: "nonce_9"
  uio[3]: "nonce_10"
  uio[4]: "nonce_11"
  uio[5]: "nonce_12"
  uio[6]: "nonce_13"
  uio[7]: "nonce_14"

# Do not change!
yaml_version: 6
